<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Lotus flower petals with gradient -->
  <g transform="translate(400,300)">
    <!-- Back petals -->
    <ellipse cx="-60" cy="-40" rx="40" ry="80" fill="url(#greenGrad)" opacity="0.8" transform="rotate(-30)"/>
    <ellipse cx="60" cy="-40" rx="40" ry="80" fill="url(#greenGrad)" opacity="0.8" transform="rotate(30)"/>
    <ellipse cx="-80" cy="20" rx="35" ry="70" fill="url(#greenGrad)" opacity="0.9" transform="rotate(-60)"/>
    <ellipse cx="80" cy="20" rx="35" ry="70" fill="url(#greenGrad)" opacity="0.9" transform="rotate(60)"/>
    
    <!-- Front petals -->
    <ellipse cx="0" cy="-60" rx="45" ry="85" fill="url(#greenGrad)"/>
    <ellipse cx="-40" cy="40" rx="40" ry="75" fill="url(#greenGrad)" transform="rotate(-90)"/>
    <ellipse cx="40" cy="40" rx="40" ry="75" fill="url(#greenGrad)" transform="rotate(90)"/>
    
    <!-- Center -->
    <circle cx="0" cy="0" r="25" fill="#059669"/>
    <circle cx="0" cy="0" r="15" fill="#4ade80"/>
  </g>
</svg>