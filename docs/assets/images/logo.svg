<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="lightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0f9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Lotus flower petals with white/light colors -->
  <g transform="translate(400,300)">
    <!-- Back petals -->
    <ellipse cx="-60" cy="-40" rx="40" ry="80" fill="url(#lightGrad)" opacity="0.9" transform="rotate(-30)" stroke="#34d399" stroke-width="2"/>
    <ellipse cx="60" cy="-40" rx="40" ry="80" fill="url(#lightGrad)" opacity="0.9" transform="rotate(30)" stroke="#34d399" stroke-width="2"/>
    <ellipse cx="-80" cy="20" rx="35" ry="70" fill="url(#lightGrad)" opacity="0.9" transform="rotate(-60)" stroke="#10b981" stroke-width="2"/>
    <ellipse cx="80" cy="20" rx="35" ry="70" fill="url(#lightGrad)" opacity="0.9" transform="rotate(60)" stroke="#10b981" stroke-width="2"/>
    
    <!-- Front petals -->
    <ellipse cx="0" cy="-60" rx="45" ry="85" fill="url(#lightGrad)" stroke="#34d399" stroke-width="3"/>
    <ellipse cx="-40" cy="40" rx="40" ry="75" fill="url(#lightGrad)" transform="rotate(-90)" stroke="#10b981" stroke-width="2"/>
    <ellipse cx="40" cy="40" rx="40" ry="75" fill="url(#lightGrad)" transform="rotate(90)" stroke="#10b981" stroke-width="2"/>
    
    <!-- Center -->
    <circle cx="0" cy="0" r="25" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="3"/>
    <circle cx="0" cy="0" r="15" fill="#ffffff"/>
  </g>
</svg>